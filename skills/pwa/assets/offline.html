<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Offline</title>
    <style>
      /* Self-contained: this page must render with nothing else cached. */
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; text-align: center; }
      button { font: inherit; padding: 0.6rem 1.2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page isn't saved on this device yet. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
