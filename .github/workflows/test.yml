name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      # pdf-parse's end-to-end tests shell out to poppler's pdftotext.
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
